{% extends 'base.html' %}

{% block signIn %}
<!-- Navigation bar -->
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid position-relative">
        <!-- Left side with logo and brand -->
        <div class="d-flex align-items-center">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='FilmIA.png') }}" alt="Logo" width="30" height="30"
                    class="d-inline-block align-text-top me-2">
                FilmIA
            </a>
        </div>

        <!-- Centered header -->
        <h1 class="h3 m-0 position-absolute start-50 translate-middle-x">FilmIA</h1>

        <!-- Right side with user menu -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="{{ url_for('signUp') }}">No tienes cuenta? Regístrate</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="bg-light border border-light rounded-3 p-5 shadow">
        <h2 class="display-5 fw-bold lh-1 mb-3 text-center">Bienvenido de vuelta!</h2>
        <form method="POST">
            <div class="form-group mt-4">
                <label for="email">E-mail:</label>
                <input type="text" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group mt-4">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-group mt-4 text-center">
                <input type="submit" value="Ingresar" class="btn btn-primary">
            </div>
            <div class="form-group mt-4 text-center">
                <span class="text-danger">{{ error_msg }}</span>
            </div>
        </form>
    </div>
</div>
{% endblock %}
