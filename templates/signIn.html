{% extends 'base.html' %}

{% block signIn %}
<nav class="d-flex justify-content-between align-items-center py-4 px-4 border-bottom">
    <a href="/" class="btn btn-outline-secondary px-4">
        Inicio
    </a>
    <h1 class="h3 m-0 text-center">FilmIA</h1>
    <a href="/signup" class="btn btn-outline-secondary px-4">
        No tienes cuenta? Regístrate
    </a>
</nav>
<div class="d-flex justify-content-center align-items-center" style="height: 100vh;">
    <div class="bg-light border border-light rounded-3 p-5 shadow">
        <h2 class="display-5 fw-bold lh-1 mb-3 text-center">Bienvenido de vuelta!</h2>
        <form method="POST">
            <div class="form-group mt-4">
                <label for="email">E-mail:</label>
                <input type="text" id="email" name="email" class="form-control" required>
            </div>
            <div class="form-group mt-4">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" class="form-control" required>
            </div>
            <div class="form-group mt-4 text-center">
                <input type="submit" value="Ingresar" class="btn btn-primary">
            </div>
            <div class="form-group mt-4 text-center">
                <span class="text-danger">{{ error_msg }}</span>
            </div>
        </form>
    </div>
</div>
{% endblock %}
