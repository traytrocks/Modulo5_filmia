{% extends 'base.html' %}

{% block signUp %}
<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid position-relative">
        <!-- Left side with logo and brand -->
        <div class="d-flex align-items-center">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <a class="navbar-brand d-flex align-items-center" href="{{ url_for('home') }}">
                <img src="{{ url_for('static', filename='FilmIA.png') }}" alt="Logo" width="30" height="30"
                    class="d-inline-block align-text-top me-2">
                FilmIA
            </a>
        </div>

        <!-- Centered header -->
        <h1 class="h3 m-0 position-absolute start-50 translate-middle-x">FilmIA</h1>

        <!-- Right side with user menu -->
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="{{ url_for('signIn') }}">Tienes cuenta? Inicia Sesión</a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<div class="form-container">
    <h2 class="form-title">Bienvenido. Crea tu perfil!</h2>
    <form method="POST">
        <div class="form-group">
            <label for="fname">Nombre:</label>
            <input type="text" id="fname" name="fname" required="required">
        </div>
        <div class="form-group">
            <label for="lname">Apellido:</label>
            <input type="text" id="lname" name="lname" required="required">
        </div>
        <div class="form-group">
            <label for="age">Edad:</label>
            <input type="text" id="age" name="age" required="required">
        </div>
        <div class="form-group">
            <label for="email">E-mail:</label>
            <input type="text" id="email" name="email" required="required">
        </div>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password" required="required">
        </div>
        <div class="form-actions">
            <input type="submit" value="Crear">
        </div>
        <div class="error-message">
            {{ error_msg }}
        </div>
        {% if success_msg %}
        <div class="success-message">
            {{ success_msg }} 
            <br>
            <a href="/">{{ msg }}</a>
        </div>
        {% endif %}
    </form>
</div>
{% endblock %}
